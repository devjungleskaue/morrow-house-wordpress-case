name: Validate WordPress case
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  reset-contract:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Test native reset failure handling
        shell: powershell
        run: .\tests\reset-local.test.ps1
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - run: npm ci
      - run: npm test
      - name: Lint PHP
        run: find wp-content scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run disposable WordPress smoke
        run: bash scripts/smoke-test.sh
      - name: Validate disclosure-safe tracked files
        run: |
          ! git grep -nEi 'api[_-]?key|client[_-]?secret|BEGIN (RSA|OPENSSH) PRIVATE KEY' -- ':!.github/workflows/quality.yml'
